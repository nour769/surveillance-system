name: Surveillance CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: pip install ultralytics supervision fastapi uvicorn python-multipart aiofiles requests pytest
    - name: Test imports
      run: |
        python -c "from ultralytics import YOLO; print('YOLO OK')"
        python -c "import supervision; print('Supervision OK')"
        python -c "import fastapi; print('FastAPI OK')"
    - name: Run tests
      run: pytest tests/ -v
